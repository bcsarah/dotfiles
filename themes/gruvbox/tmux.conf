# status
set -g status on
set -g status-style "fg=default,bg=default"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 5

set -g message-style "fg=colour14,bg=default"
set -g message-command-style "fg=colour14,bg=default"

# borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour2"

# windows
set -g window-status-activity-style "fg=colour8,bg=default"
set -g window-status-separator "  "
set -g window-status-style "fg=default,bg=default"

set -g window-status-current-format "#[fg=colour2,bold]#I #[fg=default]#W"
set -g window-status-format "#[fg=colour8]#I #[fg=default]#W"

# status bar
set -g status-right "#[fg=colour2]● #[fg=default]#S #[fg=colour8]| #[fg=colour2]󰁹 #[fg=default]#(cat /sys/class/power_supply/BAT0/capacity)% #[fg=colour8]| #[fg=colour14]%H:%M "
set -g status-left ""

# clock
set -g clock-mode-colour colour2
set -g mode-style "fg=colour3,bg=default,bold"
