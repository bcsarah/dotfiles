# tmux config
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# binds
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# vim-motions
set -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# split
unbind %
unbind '"'
bind u split-window -h -c "#{pane_current_path}"
bind y split-window -v -c "#{pane_current_path}"

# reload
unbind r
bind-key r source-file ~/.config/tmux/tmux.conf


# theme
set -g status on
set -g status-style "fg=default,bg=default"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 5

set -g message-style "fg=colour14,bg=default"
set -g message-command-style "fg=colour14,bg=default"

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour1"

set -g window-status-activity-style "fg=colour8,bg=default"
set -g window-status-separator "  "
set -g window-status-style "fg=default,bg=default"

set -g window-status-current-format "#[fg=colour1,bold]#I #[fg=default]#W"
set -g window-status-format "#[fg=colour8]#I #[fg=default]#W"
set -g status-right "#[fg=colour1]● #[fg=default]#S #[fg=colour8]| #[fg=colour1]󰁹 #[fg=default]#(cat /sys/class/power_supply/BAT0/capacity)% #[fg=colour8]| #[fg=colour14]%H:%M "

set -g status-left ""
set -g clock-mode-colour colour1
set -g mode-style "fg=colour3,bg=default,bold"
