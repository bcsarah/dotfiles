
# Main
[main]
font=JetBrainsMono Nerd Font Mono:size=11
font-bold=JetBrainsMono Nerd Font Mono:weight=bold:size=11
font-italic=JetBrainsMono Nerd Font Mono:slant=italic:size=11
font-bold-italic=JetBrainsMono Nerd Font Mono:weight=bold:slant=italic:size=11

initial-color-theme=dark
initial-window-size-pixels=1200x700
pad=4x4
resize-by-cells=no

# Cursor
[cursor]
style=block
blink=no

# Mouse
[mouse]
hide-when-typing=yes

# Colors
[colors-dark]
alpha=0.98
alpha-mode=default
background=121212
foreground=f5f5f5
selection-background=b4b4b4
selection-foreground=f5f5f5

# Normal colors
regular0=121212
regular1=B14242
regular2=D87C4A
regular3=E49A44
regular4=4A8B8B
regular5=a7a7a7
regular6=b4b4b4
regular7=d5d5d5

# Bright colors
bright0=949494
bright1=B14242
bright2=D87C4A
bright3=E49A44
bright4=4A8B8B
bright5=a7a7a7
bright6=b4b4b4
bright7=d5d5d5

# URLs
urls=4A8B8B
