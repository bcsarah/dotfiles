# idk
backend = "glx";
vsync = true;
glx-copy-from-front = false;

# shadows
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.4;
shadow-offset-x = -7;
shadow-offset-y = -4;

# fading
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 5;

# opacity
active-opacity = 0.98;
inactive-opacity = 0.95;

# finer adjustments
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
