# theme and beautifulness
include current-theme.conf

font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

window_padding_width 4
background_opacity 0.98

# === [ Atalhos ] === #
kitty_mod alt

# novas abas e fechar abas
map kitty_mod+u       launch --location=vsplit
map kitty_mod+i       launch --location=hsplit
map kitty_mod+w       close_window

# vim-motions
map kitty_mod+h             neighboring_window left
map kitty_mod+j             neighboring_window down
map kitty_mod+k             neighboring_window up
map kitty_mod+l             neighboring_window right

map kitty_mod+shift+h       move_window left
map kitty_mod+shift+l       move_window right
map kitty_mod+shift+k       move_window up
map kitty_mod+shift+j       move_window down

map kitty_mod+ctrl+h        resize_window wider
map kitty_mod+ctrl+j        resize_window taller
map kitty_mod+ctrl+k        resize_window shorter
map kitty_mod+ctrl+l        resize_window narrower

# abas
map kitty_mod+t       new_tab
map kitty_mod+q       launch --location=vsplit
map kitty_mod+enter   next_layout
map kitty_mod+1       goto_tab 1
map kitty_mod+2       goto_tab 2
map kitty_mod+3       goto_tab 3
map kitty_mod+4       goto_tab 4


# == [ BAR } == #
tab_bar_edge           top
tab_bar_style          powerline
tab_bar_min_tabs       
tab_title_template     "{index}: {title}"

# cores
active_tab_background     #b8bb26
active_tab_foreground     #282828
active_tab_font_style     bold
inactive_tab_background   #3c3836
inactive_tab_foreground   #928374
inactive_tab_font_style   normal

# layout
window_margin_width   2
window_border_width   1.25pt
active_border_color   #b8bb26
inactive_border_color #928374


# janela
remember_window_size   yes
initial_window_width   1200
initial_window_height  700

# outros
map kitty_mod+shift+r   load_config_file
confirm_os_window_close 0
copy_on_select          yes
strip_trailing_spaces   smart
